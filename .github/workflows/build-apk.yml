name: Build Android APK

# Builds the debug APK on every push to these branches (or on-demand via the
# "Run workflow" button) and publishes it to a GitHub Release with a stable
# download link - the GitHub-native equivalent of a Netlify deploy preview,
# since Netlify itself has no Android SDK/build support.

on:
  push:
    branches:
      - "claude/credit-card-benefits-tracker-i0jp0m"
      - "claude/travel-rewards-aggregator-rbhc41"
  workflow_dispatch:
    inputs:
      appAuthRedirectScheme:
        description: >-
          Reversed Google OAuth client ID, e.g. com.googleusercontent.apps.123456-abc
          (leave blank for a normal build). Required for Gmail sign-in: Google sends
          the OAuth response to this scheme, and it is compiled into the manifest, so
          a build whose scheme does not match your client ID can never complete
          sign-in. The resulting APK is published to the "gmail-build" release.
        required: false
        default: ""

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests (JVM)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon ${{ inputs.appAuthRedirectScheme && format('-PappAuthRedirectScheme={0}', inputs.appAuthRedirectScheme) || '' }}

      # Runs R8 with app/proguard-rules.pro. The debug build never shrinks, so
      # without this a missing keep rule would only surface as a crash on a real
      # release install. Unsigned unless a keystore is configured (see README).
      - name: Build release APK (verifies the R8 / ProGuard rules)
        run: ./gradlew assembleRelease --no-daemon ${{ inputs.appAuthRedirectScheme && format('-PappAuthRedirectScheme={0}', inputs.appAuthRedirectScheme) || '' }}

      - name: Upload build artifact (kept even if the release step below fails)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      # Proves the APK really listens on the requested scheme, rather than
      # trusting that the Gradle property reached the manifest. Getting this
      # wrong produces an APK that looks fine and can never finish sign-in,
      # which is exactly the failure this input exists to avoid.
      - name: Verify the built APK declares the requested redirect scheme
        if: inputs.appAuthRedirectScheme != ''
        run: |
          set -euo pipefail
          AAPT2="$(find "$ANDROID_HOME/build-tools" -name aapt2 | sort -V | tail -1)"
          echo "Using $AAPT2"
          MANIFEST="$("$AAPT2" dump xmltree app/build/outputs/apk/debug/app-debug.apk --file AndroidManifest.xml)"
          if echo "$MANIFEST" | grep -qF '${{ inputs.appAuthRedirectScheme }}'; then
            echo "OK: the APK declares ${{ inputs.appAuthRedirectScheme }}"
          else
            echo "The APK does NOT declare ${{ inputs.appAuthRedirectScheme }}. Schemes found:"
            echo "$MANIFEST" | grep -i 'scheme' || true
            exit 1
          fi

      # A build carrying someone's own OAuth scheme is personal to them, so it
      # goes to its own tag instead of replacing the generic download.
      - name: Publish the Gmail-enabled APK to the "gmail-build" release
        if: inputs.appAuthRedirectScheme != ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: gmail-build
          name: Gmail-enabled debug build
          body: |
            Built from commit ${{ github.sha }} with
            `appAuthRedirectScheme=${{ inputs.appAuthRedirectScheme }}`.

            Use this APK only if that is the reversed form of YOUR Google OAuth
            client ID. Sign-in fails with any other build. Everything else in the
            app works identically to the generic `debug-latest` download.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the "debug-latest" release
        if: inputs.appAuthRedirectScheme == ''
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Latest debug build
          body: |
            Automatically built from commit ${{ github.sha }}.
            Download `app-debug.apk` below and sideload it - see README.md
            for install instructions and one-time Gmail/Anthropic setup.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk

  # Instrumented tests on a headless emulator: Room migrations v1 -> current
  # against real SQLite, and a launch/navigation smoke test through the
  # onboarding flow. Runs in parallel with the APK build so a slow emulator
  # never blocks the download link; the result is visible on the commit.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # 30 is the floor this app still supports; 34 matches a current phone.
        # Several crash classes only appear on newer API levels (PendingIntent
        # mutability, notification permission, background restrictions), so
        # testing one level alone leaves those uncovered.
        api-level: [30, 34]
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (API ${{ matrix.api-level }} emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: ${{ matrix.api-level }}
          arch: x86_64
          target: default
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Print instrumented failures into the log
        if: failure()
        run: |
          grep -rl "<failure" app/build/outputs/androidTest-results/connected 2>/dev/null | while read f; do
            echo "=== $f"; python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for tc in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for f in tc.findall("failure"):
                  print(f"--- {tc.get('classname')}.{tc.get('name')}")
                  print((f.text or "")[:6000])
          PY
          done

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports-api${{ matrix.api-level }}
          path: app/build/reports/androidTests/connected
