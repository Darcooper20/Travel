name: Build Android APK

# Builds the debug APK on every push to these branches (or on-demand via the
# "Run workflow" button) and publishes it to a GitHub Release with a stable
# download link - the GitHub-native equivalent of a Netlify deploy preview,
# since Netlify itself has no Android SDK/build support.

on:
  push:
    branches:
      - "claude/credit-card-benefits-tracker-i0jp0m"
      - "claude/travel-rewards-aggregator-rbhc41"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Unit tests (JVM)
        run: ./gradlew testDebugUnitTest --no-daemon

      - name: Upload unit test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: unit-test-reports
          path: app/build/reports/tests/testDebugUnitTest

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload build artifact (kept even if the release step below fails)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the "debug-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Latest debug build
          body: |
            Automatically built from commit ${{ github.sha }}.
            Download `app-debug.apk` below and sideload it - see README.md
            for install instructions and one-time Gmail/Anthropic setup.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk

  # Instrumented tests on a headless emulator: Room migrations v1 -> current
  # against real SQLite, and a launch/navigation smoke test through the
  # onboarding flow. Runs in parallel with the APK build so a slow emulator
  # never blocks the download link; the result is visible on the commit.
  instrumented:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Enable KVM for the emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Instrumented tests (API 30 emulator)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          arch: x86_64
          target: default
          profile: pixel_5
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon

      - name: Print instrumented failures into the log
        if: failure()
        run: |
          grep -rl "<failure" app/build/outputs/androidTest-results/connected 2>/dev/null | while read f; do
            echo "=== $f"; python3 - "$f" <<'PY'
          import sys, xml.etree.ElementTree as ET
          for tc in ET.parse(sys.argv[1]).getroot().iter("testcase"):
              for f in tc.findall("failure"):
                  print(f"--- {tc.get('classname')}.{tc.get('name')}")
                  print((f.text or "")[:6000])
          PY
          done

      - name: Upload instrumented test reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: instrumented-test-reports
          path: app/build/reports/androidTests/connected
