name: Build Android APK

# Builds the debug APK on every push to this branch (or on-demand via the
# "Run workflow" button) and publishes it to a GitHub Release with a stable
# download link - the GitHub-native equivalent of a Netlify deploy preview,
# since Netlify itself has no Android SDK/build support.

on:
  push:
    branches: ["claude/credit-card-benefits-tracker-i0jp0m"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: "temurin"
          java-version: "17"

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Build debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload build artifact (kept even if the release step below fails)
        uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk

      - name: Publish APK to the "debug-latest" release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: debug-latest
          name: Latest debug build
          body: |
            Automatically built from commit ${{ github.sha }}.
            Download `app-debug.apk` below and sideload it - see README.md
            for install instructions and one-time Gmail/Anthropic setup.
          prerelease: true
          files: app/build/outputs/apk/debug/app-debug.apk
